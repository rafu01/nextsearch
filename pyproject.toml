[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextsearch"
version = "0.1.0"
description = "RAG system for Obsidian notes and PDF textbooks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # --- Parsing ---
    "pymupdf>=1.24",
    "python-frontmatter>=1.0.1,<1.1",

    # --- Gemini (generation + optional embeddings) ---
    "google-genai>=0.5",

    # --- Local embeddings ---
    "sentence-transformers>=3",
    "numpy>=1.24",

    # --- Vector Store ---
    "chromadb>=0.5",

    # --- Utilities ---
    "python-dotenv>=1.0",
    "rich>=13",
    "typer>=0.12",
    "tqdm>=4.66",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tiktoken>=0.7",
    "langchain-text-splitters>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx>=0.27",
]

[project.scripts]
nextsearch = "nextsearch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
